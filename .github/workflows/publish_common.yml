# Publish pre-3.0 specs (spec versions that do not require spec-parser)
# This workflow can be triggered manually or by a repository dispatch event.
# It has three parameters:
# - ref: The branch or tag to publish
# - as_version: The version to publish as
# - aliases: Space-delimited aliases (overwrite existing aliases or versions with the same names)

on:
  repository_dispatch:
    types:
      - publish_spec
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to publish (e.g. refs/heads/support/2.3).
        required: true
        default: refs/heads/support/2.3
      as_version:
        description: Version to publish as (e.g. v2.3.1).
        required: true
        default: v2.3.1
      aliases:
        description: Space-delimited aliases to publish (e.g. v2-latest v2-draft 2.3.1 v2.3.1-dev 2.3.1-dev)
        required: false
permissions:
  contents: write
concurrency:
  group: publish-gh-pages
  cancel-in-progress: false  # Cancelling mid-push could leave gh-pages half-updated
jobs:
  build:
    runs-on: ubuntu-latest
    container: python:3.14
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
      with:
        ref: ${{ github.event.client_payload.ref || github.event.inputs.ref }}
        path: spdx-spec
        fetch-depth: 0  # Because we will be pushing the gh-pages branch
    - name: Install pre-requisites
      run: pip install json-schema-for-humans==1.5.1 mike==2.2.0 mkdocs==1.6.1
    - name: Generate schema doc
      working-directory: spdx-spec
      run: generate-schema-doc schemas/spdx-schema.json chapters/spdx-json-schema.html
    - name: Set Git identity
      working-directory: spdx-spec
      run: |
        git config user.name github-actions
        git config user.email github-actions@github.com
    - name: Commit JSON schema to schemas/$VERSION in develop
      # Commit the schema to schemas/<version>/ in the develop branch
      working-directory: spdx-spec
      env:
        AS_VERSION: ${{ github.event.client_payload.as_version || github.event.inputs.as_version }}
      run: |
        VER=${AS_VERSION#[vV]}
        # Use an isolated worktree to leave the support-branch checkout untouched
        git fetch origin develop
        WT=$(mktemp -d)
        git worktree add --force "$WT" FETCH_HEAD
        mkdir -p "$WT/schemas/$VER"
        cp schemas/spdx-schema.json "$WT/schemas/$VER/spdx-schema.json"
        git -C "$WT" add "schemas/$VER/spdx-schema.json"
        git -C "$WT" diff --cached --quiet || \
          git -C "$WT" commit -m "Update schemas/$VER"
        git -C "$WT" push origin HEAD:develop
        git worktree remove --force "$WT"
    - name: Build docs
      working-directory: spdx-spec
      env:
        AS_VERSION: ${{ github.event.client_payload.as_version || github.event.inputs.as_version }}
        ALIASES: ${{ github.event.client_payload.aliases || github.event.inputs.aliases }}
      run: |
        set -f
        # This step does 2 things:
        # 1) delete existing versions or aliases that have the same names as
        #    ALIASES, if they exist (--update-aliases cannot take over a name
        #    that is a version).
        # 2) deploy as AS_VERSION, with aliases
        for alias in $ALIASES; do
          mike delete "$alias" || true
        done
        mike deploy --update-aliases --push "$AS_VERSION" $ALIASES
